<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="CreatorPerks: brands pay only for real views. Creators earn per 1,000 views on Reels and Shorts." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('cr_theme');
        if (t === 'light' || t === 'auto') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>CreatorPerks: earn per 1,000 views on Reels and Shorts</title>

    <meta name="apple-mobile-web-app-title" content="CreatorPerks" />
    <!-- Link previews (WhatsApp, Instagram, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CreatorPerks" />
    <meta property="og:title" content="CreatorPerks: creators earn on views, brands pay for results" />
    <meta property="og:description" content="Post Reels and Shorts for brands and earn per 1,000 real views. Brands pay only for verified views." />
    <meta property="og:url" content="https://creatorperks.in/" />
